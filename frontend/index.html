<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>我的个人博客</h1>
            <nav>
                <a href="index.html">首页</a>
                <a href="admin.html">管理后台</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="articles-container">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 我的个人博客. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000/api' 
            : '/api';

        // 加载所有文章
        async function loadArticles() {
            try {
                const response = await fetch(`${API_URL}/articles`);
                const result = await response.json();
                
                if (result.success) {
                    displayArticles(result.data);
                } else {
                    showError('加载文章失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            }
        }

        // 显示文章列表
        function displayArticles(articles) {
            const container = document.getElementById('articles-container');
            
            if (articles.length === 0) {
                container.innerHTML = '<p class="no-articles">暂无文章</p>';
                return;
            }

            container.innerHTML = articles.map(article => `
                <article class="article-card">
                    <h2>${escapeHtml(article.title)}</h2>
                    <div class="article-meta">
                        <span>作者: ${escapeHtml(article.author)}</span>
                        <span>发布时间: ${formatDate(article.createdAt)}</span>
                    </div>
                    ${article.tags && article.tags.length > 0 ? `
                        <div class="tags">
                            ${article.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div class="article-content">
                        ${escapeHtml(article.content.substring(0, 200))}${article.content.length > 200 ? '...' : ''}
                    </div>
                    <button onclick="viewArticle('${article._id}')" class="btn">阅读全文</button>
                </article>
            `).join('');
        }

        // 查看文章详情
        function viewArticle(id) {
            window.location.href = `article.html?id=${id}`;
        }

        // 显示错误
        function showError(message) {
            const container = document.getElementById('articles-container');
            container.innerHTML = `<p class="error">${message}</p>`;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 页面加载时获取文章
        loadArticles();
    </script>
</body>
</html>
